services:
  # --- POSTGRES (Supabase-kompatibel) ---
  db:
    container_name: supabase-db
    image: postgres:15-alpine
    volumes:
      - ./docker/db/data:/var/lib/postgresql/data
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
    ports:
      - "54322:5432"

  # --- WINDMILL (Business Logic) ---
  windmill:
    image: ghcr.io/windmill-labs/windmill:latest
    container_name: windmill
    ports:
      - "8080:8000"
    environment:
      - DATABASE_URL=${WINDMILL_DATABASE_URL}
    depends_on:
      db:
        condition: service_healthy

  # --- NODE-RED (Hardware/IoT) ---
  node-red:
    image: nodered/node-red:latest
    container_name: node-red
    ports:
      - "1880:1880"
    volumes:
      - ./node-red:/data
    environment:
      - TZ=Europe/Berlin
    depends_on:
      db:
        condition: service_healthy

  # --- MONITORING ---
  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    volumes:
      - ./monitoring/prometheus:/etc/prometheus
    ports:
      - "9090:9090"

  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    ports:
      - "3001:3000"
    volumes:
      - ./monitoring/grafana:/var/lib/grafana
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD}

  # --- AI SERVICE (Buchungs-KI + Fasshistorie) ---
  ai-service:
    build:
      context: ../apps/ai-service
    container_name: ai-service
    ports:
      - "8092:8080"
    environment:
      - OLLAMA_API_URL=http://host.docker.internal:11434/api
      - OLLAMA_MODEL=${OLLAMA_MODEL:-llama3.1:8b}
    extra_hosts:
      - "host.docker.internal:host-gateway"

  # NOTE: Ollama läuft nativ auf dem Host (localhost:11434).
  # Für Docker-Services erreichbar via host.docker.internal:11434

  # --- BUCHUNGS-WEBAPP (öffentlich, Port 5174) ---
  booking:
    build:
      context: ..
      dockerfile: apps/booking/Dockerfile
      args:
        VITE_SUPABASE_URL: ${VITE_SUPABASE_URL:-http://localhost:54321}
        VITE_SUPABASE_ANON_KEY: ${VITE_SUPABASE_ANON_KEY}
        VITE_AI_SERVICE_URL: ""
    container_name: booking
    ports:
      - "5174:80"
    depends_on:
      - ai-service

networks:
  default:
    name: pfand-chip-net
